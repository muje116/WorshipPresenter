<!DOCTYPE html>

<style>
        .material-symbols-outlined {

        }
        .signature-gradient {
            background: linear-gradient(135deg, #bbc3ff 0%, #001d92 100%);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #bbc3ff;
            cursor: pointer;
            border-radius: 50%;

<body class="bg-background text-on-background font-body select-none">
<!-- TopAppBar -->
<header class="bg-[#0b1326] dark:bg-[#0b1326] shadow-[0_32px_32px_rgba(187,195,255,0.08)] fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 font-['Manrope'] tracking-wide">

</div>
<div class="flex items-center gap-4">

<span class="material-symbols-outlined text-[#c6c5d4] cursor-pointer hover:bg-[#222a3d] p-2 transition-colors duration-200">help</span>
</div>
<button class="signature-gradient text-on-primary-fixed px-5 py-2 rounded-lg font-headline font-bold text-sm active:scale-95 duration-200">Go Live</button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant/20">

</div>
</div>
</header>
<div class="flex h-screen pt-16">
<!-- SideNavBar -->
<aside class="bg-[#131b2e] dark:bg-[#131b2e] h-full w-64 flex flex-col fixed left-0 top-0 pt-16 no-border font-['Inter'] text-sm">
<div class="p-4 flex items-center gap-3">
<div class="w-8 h-8 bg-surface-container-highest rounded flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-lg">auto_stories</span>
</div>
<div>
<h3 class="text-[#dae2fd] font-['Manrope'] font-bold leading-tight">Main Stage</h3>

</div>
</div>
<div class="px-3 space-y-1 mt-4">

<span class="material-symbols-outlined">auto_stories</span> Library
                </button>
<button class="w-full text-left px-3 py-2.5 rounded-lg bg-[#222a3d] text-[#dae2fd] border-l-4 border-[#bbc3ff] transition-all flex items-center gap-3">
<span class="material-symbols-outlined">movie</span> Media
                </button>
<button class="w-full text-left px-3 py-2.5 rounded-lg text-[#c6c5d4] hover:bg-[#171f33] transition-all flex items-center gap-3">

<span class="material-symbols-outlined">palette</span> Themes

<span class="material-symbols-outlined">settings_input_component</span> Automation

<div class="mt-auto p-4 space-y-1">
<button class="w-full text-left px-3 py-2 rounded-lg text-[#c6c5d4] hover:bg-[#171f33] flex items-center gap-3">
<span class="material-symbols-outlined">contact_support</span> Support
                </button>

<div class="w-full max-w-4xl aspect-video bg-surface-container rounded-xl shadow-2xl relative overflow-hidden group">

<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-60 blur-[4px]" data-alt="cinematic mountain landscape at night under a starlit sky with deep blue and purple tones" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBym_AhWQkmOG_vPIGaQ3stfGvO7NfsOo3LZ77XKOwfv5Imsgqjmm8yg1ey79jwvGSSNa0aKVUDizrOtPpXGY4OAj_lU38FKjg1qPM_5iJsDbsW-46cUGTPjtp3GxcyLncLnK5oGlaBnDPI5g1lnVlRuByKiZaOU7HHjZsYmGYS1htjjlBBybzH7xj_r1xbGWd03AYm5mJU29Gpd6CyGdY1a6Hs5G2ulsh0dkU8cpGr3tz6N8EcIWZDJx--tKKC3A9_RxtEG4DMmZw"/>

                        Amazing Grace
                    </h1>
</div>

<div class="w-2 h-2 rounded-full bg-tertiary"></div>
<span class="text-xs font-bold text-tertiary tracking-widest uppercase">Live View</span>
</div>
</div>
<!-- Editor HUD -->
<div class="mt-12 flex gap-4">
<div class="bg-surface-container-high/80 backdrop-blur-xl px-6 py-3 rounded-full border border-outline-variant/10 flex items-center gap-6 shadow-2xl">

<span class="text-xs font-semibold uppercase tracking-wider">Verse 1</span>
</div>
<div class="h-4 w-px bg-outline-variant/30"></div>

</button>
<button class="p-2 hover:bg-surface-variant rounded transition-colors">

</div>

</div>
</div>

<div class="flex justify-between items-center">

</div>

<div class="aspect-square rounded-lg overflow-hidden bg-surface-container border border-outline-variant/20 hover:border-primary/50 transition-all cursor-pointer">

<span class="material-symbols-outlined text-outline">add</span>
</div>
</div>
</div>
</div>
</div>
<!-- Footer Action -->
<div class="absolute bottom-0 left-0 w-full p-6 bg-surface-container-low/80 backdrop-blur-md">
<button class="w-full py-3 bg-surface-container-highest text-primary font-headline font-bold text-sm rounded-lg hover:bg-surface-container-high transition-colors active:scale-95">
                    Save as Template

</div>
